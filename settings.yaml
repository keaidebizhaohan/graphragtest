### This config file contains required core defaults that must be set, along with a handful of common optional settings.
### For a full list of available settings, see https://microsoft.github.io/graphrag/config/yaml/

### LLM settings ###
### LLM settings ###
completion_models:
  default_completion_model:
    model_provider: openai            # DeepSeek 兼容 OpenAI 格式
    model: deepseek-v4-pro             # 填入 DeepSeek 官方模型名
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}      # 自动读取 .env 里的 DeepSeek Key
    api_base: https://api.deepseek.com/v1

    # ======= 核心：手动添加以下参数来限制并发，防止 DeepSeek 报错 =======
    concurrent_requests: 2             # 严格限制并发请求数（默认通常是 16 以上，很容易冲垮 DeepSeek，改成 2 甚至 1）
    requests_per_minute: 60            # 每分钟最多请求次数（根据你的 DeepSeek 账户层级调整，限流严重就调小）
    tokens_per_minute: 40000           # 每分钟最多 Token 数
    # ===================================================================

    retry:
      type: exponential_backoff
      max_retries: 10                  # 顺便把重试次数加大，遇到网络波动会自动多试几次

embedding_models:
  default_embedding_model:
    model_provider: openai            # 阿里灵积/百炼也全面兼容 OpenAI 格式
    model: text-embedding-v3          # 核心：这是阿里目前最强的文本向量模型
    auth_method: api_key
    api_key: ${ALIYUN_API_KEY}        # 自动读取 .env 里的阿里 Key
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1 # 核心：阿里的兼容 OpenAI 接口地址
    retry:
      type: exponential_backoff

### Document processing settings ###
input:
  type: text # [csv, text, json, jsonl]

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: cl100k_base         # 保持通用编码

### Storage settings ###
input_storage:
  type: file
  base_dir: "input"

output_storage:
  type: file
  base_dir: "output"

reporting:
  type: file
  base_dir: "logs"

cache:
  type: json
  storage:
    type: file
    base_dir: "cache"

vector_store:
  type: lancedb
  db_uri: output/lancedb

### Workflow settings ###
embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  entity_types: [organization,person,geo,event]
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: false
  embeddings: false

### Query settings ###
local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: default_completion_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_search_reduce_prompt.txt"

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"